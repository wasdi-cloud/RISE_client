<div class="calendar-pill" [class.has-time]="m_bShowTime">

  <!-- Hidden Input for Datepicker Binding -->
  <input
    [value]="m_oSelectedDate | date:'mediumDate':'UTC'"
    (dateChange)="emitDate($event)"
    matInput
    [matDatepicker]="picker"
    [matDatepickerFilter]="dateFilter"
    class="hidden-picker-input"
    disabled
  >

  <!-- Left Side: Time (if active) & Date Text -->
  <div class="calendar-text-group" (click)="picker.open()">
    <span *ngIf="m_bShowTime" class="time-display">
      {{ m_oSelectedDate | date:'HH:mm' : 'UTC'}}
    </span>
    <span class="date-text">
      {{ m_oSelectedDate | date:'dd MMM yyyy' : 'UTC' }}
    </span>
  </div>

  <!-- Right Side: Material Toggle Icon -->
  <mat-datepicker-toggle [disableRipple]="true" matIconSuffix [for]="picker" class="calendar-toggle">
  </mat-datepicker-toggle>

  <mat-datepicker
    [dateClass]="dateClass"
    xPosition="end"
    yPosition="above"
    disabled="false"
    #picker>
  </mat-datepicker>
</div>
