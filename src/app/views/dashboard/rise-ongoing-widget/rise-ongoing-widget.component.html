<div class="widget-card">
  <div class="widget-header d-flex flex-row justify-content-between align-items-center gap-2" (click)="collapseWidget()">
    <div class="d-flex flex-row align-items-center gap-2">
      <span class="material-symbols-outlined header-icon">emergency</span>
      <span class="header-title">{{ "WIDGET.ONGOING_EVENTS" | translate }}</span>
      <rise-badge
        [m_iDisplayNum]="m_aoOngoingEvent.length"
        [class.has-items]="m_aoOngoingEvent.length > 0">
      </rise-badge>
    </div>

    <span class="material-symbols-outlined chevron-icon" [class.rotated]="!m_bShowContent">
      expand_less
    </span>
  </div>

  <div *ngIf="m_bShowContent" class="widget-body">
    @if (m_aoOngoingEvent.length > 0) {
      <div class="event-list d-flex flex-column gap-2 mt-2">
        <div class="event-item d-flex flex-row justify-content-between align-items-center" *ngFor="let oEvent of m_aoOngoingEvent">
          <div class="d-flex flex-row align-items-center gap-3">
            <!-- Dynamic class binding based on the event type to color-code the badge -->
            <div class="event-badge" [ngClass]="oEvent.type | lowercase">
              {{ oEvent.type }}
            </div>
            <div class="event-name">{{ oEvent.name }}</div>
          </div>
          <span (click)="openTargetArea(oEvent.areaId); $event.stopPropagation()"
                class="material-symbols-outlined widget-gold-icon"
                [matTooltip]="oEvent.areaName || 'Go to event'">my_location</span>
        </div>
      </div>
    } @else {
      <!-- Calmer empty state -->
      <div class="empty-state d-flex flex-row align-items-center gap-2 mt-2">
        <span class="material-symbols-outlined empty-icon">check_circle</span>
        <span class="empty-text">{{ "WIDGET.NO_EVENTS" | translate }}</span>
      </div>
    }
  </div>
</div>
