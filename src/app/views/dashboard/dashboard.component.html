<main class="d-flex flex-column">
  <div class="flex-fill d-flex flex-row">

    <div class="rise-sidebar d-flex flex-column gap-3 scrollable-sidebar" [class.collapsed]="m_bIsSidebarCollapsed">



      <div class="logo-help-row d-flex align-items-center justify-content-between gap-2">
        <img
          class="align-self-start"
          src="/assets/rise-assets/logo-white-horizontal.svg"
          alt="RISE Logo"
        />
        <a
          class="help-link d-inline-flex align-items-center gap-1"
          href="https://rise-docs.readthedocs.io/en/latest/"
          target="_blank"
          rel="noopener noreferrer"
          title="Open help documentation"
          aria-label="Open help documentation"
        >
          <span class="material-symbols-outlined">help</span>
        </a>
      </div>

      <rise-banner [m_sHeaderKey]="'BANNER.LIVE_SIT'" (click)="openSidebarWidget(null)"></rise-banner>
      <rise-affected-widget #affectedWidget [m_iAffectedPpl]="m_iAffectedPpl" (click)="openSidebarWidget(affectedWidget)"></rise-affected-widget>
      <rise-ongoing-widget #ongoingWidget [m_aoOngoingEvent]="m_aoOngoingEvents" (click)="openSidebarWidget(ongoingWidget)"></rise-ongoing-widget>
      <rise-alerts-widget #alertsWidget [m_aoAlerts]="m_aoAlerts" (click)="openSidebarWidget(alertsWidget)"></rise-alerts-widget>
      <rise-aoo-widget #areasWidget
        [m_aoAreas]="m_aoAreas"
        [m_bShowPublicAoOs]="m_bShowPublicAoOs"
        (m_oTogglePublic)="togglePublicAoOs()"
        (click)="openSidebarWidget(areasWidget)">
      </rise-aoo-widget>
    </div>
    <div class="sidebar-toggle"
         [class.collapsed]="m_bIsSidebarCollapsed"
         (click)="toggleSidebar()"
         [title]="m_bIsSidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'">
      <span class="material-symbols-outlined">
        {{ m_bIsSidebarCollapsed ? 'chevron_right' : 'chevron_left' }}
      </span>
    </div>
    <div class="map-container flex-fill">
      <div class="map-user-menu">
        <rise-user-menu class="user-menu"></rise-user-menu>
      </div>

      <div class="map-create-control d-flex gap-2 flex-column">
        <rise-button
          class="toggle-public-btn"
          [m_sLabel]="''"
          [m_sIconLeft]="m_bShowPublicAoOs ? 'visibility' : 'visibility_off'"
          [m_sRole]="'action'"
          [m_sSize]="'small'"
          (click)="togglePublicAoOs()"
          [title]="m_bShowPublicAoOs ? 'Hide public areas' : 'Show public areas'"
        ></rise-button>

        <rise-button
          class="create-area-btn"
          [m_sLabel]="''"
          [m_sIconLeft]="(m_bEnableAreaDrawing || m_bShowAreaCreationMenu) ? 'close' : 'add'"
          [m_sRole]="m_bEnableAreaDrawing ? 'danger' : 'action'"
          [m_sSize]="'small'"
          (click)="toggleAreaCreationMenu()"
          [title]="m_bEnableAreaDrawing ? 'Cancel drawing' : 'Create new area'"
        ></rise-button>

        <div class="map-create-submenu" *ngIf="m_bShowAreaCreationMenu && !m_bEnableAreaDrawing">
          <rise-button
            class="create-area-sub-btn"
            [m_sLabel]="''"
            [m_sIconLeft]="'rectangle'"
            [m_sRole]="'action'"
            [m_sSize]="'small'"
            (click)="startAreaDrawingCreation()"
            [title]="'Draw rectangle'"
          ></rise-button>
          <rise-button
            class="create-area-sub-btn"
            [m_sLabel]="''"
            [m_sIconLeft]="'pin_invoke'"
            [m_sRole]="'action'"
            [m_sSize]="'small'"
            (click)="startManualBboxCreation()"
            [title]="'Manual bounding box'"
          ></rise-button>
        </div>
      </div>

      <rise-map
        [m_aoAreas]="m_aoAreas"
        [m_bDashboardMap]="true"
        [m_bEnableDashboardDrawing]="m_bEnableAreaDrawing"
        (m_oDashboardAreaDrawn)="onAreaShapeDrawn($event)"
      ></rise-map>
    </div>
  </div>
</main>
